name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  REGISTRY_IMAGE: ghcr.io/usr-wwelsh/research-digest

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod

      - name: Vet
        run: go vet ./...
        working-directory: server

      - name: Server tests
        run: go test ./...
        working-directory: server

      - name: Fuzz
        run: |
          go test -run '^$' -fuzz FuzzCachePolicyNeverAllowsOutsideAllowlist -fuzztime 15s
          go test -run '^$' -fuzz FuzzHandlerNeverServesOutsideRoot -fuzztime 15s
        working-directory: server

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: server

      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 ./...
        working-directory: server

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: research-digest:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: tests/container_smoke.sh

      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: research-digest:test
          artifact-name: sbom.spdx.json

      - name: Vulnerability scan
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          image: research-digest:test
          fail-build: true
          severity-cutoff: low

  publish:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
