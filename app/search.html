<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search • Research Digest</title>
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#0f0f0f" />
  <link rel="icon" type="image/svg+xml" href="../icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png" />
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div id="nav"></div>
    <h1>Search</h1>
    <div class="search-row">
      <input id="q" class="searchbar" type="search" placeholder="Search arXiv, Semantic Scholar, OpenReview…" autocomplete="off" />
      <button id="add-interest-btn" class="btn" type="button" disabled title="Fetch and summarize new papers matching this search, from now on">+ Add as interest</button>
    </div>
    <div class="papers-grid" id="results"></div>
    <div id="empty" class="empty" hidden>No results. Try a different search.</div>
    <div id="hint" class="empty">Search live across all three sources — results here aren't in your digest yet.</div>
  </div>
  <script type="module" src="pwa.js"></script>
  <script type="module" src="search.js"></script>
</body>
</html>
